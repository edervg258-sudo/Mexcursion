server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # ─── Security Headers ────────────────────────────────────────────────────
    # HSTS: 2 años, incluye subdominios, elegible para preload
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Content Security Policy — ajustado para Expo Web + Supabase + Stripe + Sentry
    add_header Content-Security-Policy "
        default-src 'none';
        script-src  'self' 'unsafe-inline' https://js.stripe.com https://cdn.sentry.io;
        style-src   'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src    'self' https://fonts.gstatic.com data:;
        img-src     'self' data: blob: https://*.supabase.co https://picsum.photos https://fastly.picsum.photos https://*.unsplash.com;
        connect-src 'self'
                    https://*.supabase.co
                    wss://*.supabase.co
                    https://api.stripe.com
                    https://cdn.sentry.io
                    https://o*.ingest.sentry.io
                    https://api.mixpanel.com;
        frame-src   https://js.stripe.com https://hooks.stripe.com;
        frame-ancestors 'none';
        base-uri    'self';
        form-action 'self';
        upgrade-insecure-requests;
    " always;

    # Evita que el browser haga MIME-sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # Bloquea que la app se embeba en iframes (clickjacking)
    add_header X-Frame-Options "DENY" always;

    # Controla qué información de referrer se envía
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Desactiva APIs de hardware sensibles no usadas
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self https://js.stripe.com), usb=(), interest-cohort=()" always;

    # Activa XSS-filter en navegadores antiguos (compatibilidad)
    add_header X-XSS-Protection "1; mode=block" always;

    # ─── Cache: assets versionados (hashed filenames) ────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        log_not_found off;
    }

    # ─── Cache: no cachear HTML (siempre fresco) ─────────────────────────────
    location ~* \.html$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ─── SPA routing — redirige 404s al index ────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        log_not_found off;

        # No cachear HTML dinámico
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ─── Bloquear acceso a archivos sensibles ────────────────────────────────
    location ~ /\. {
        deny all;
        return 404;
    }

    location ~* \.(env|map|ts|tsx|json)$ {
        deny all;
        return 404;
    }

    # ─── Tamaño máximo de body (protección básica DoS) ───────────────────────
    client_max_body_size 2m;
}
